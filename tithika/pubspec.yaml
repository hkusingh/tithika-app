name: tithika
description: "Tithika — Hindu lunar calendar with tithi-accurate moon phases."
publish_to: 'none'

version: 1.5.2+19

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Persistence
  shared_preferences: ^2.3.0

  # Location
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Timezone (DST-aware UTC offset per date)
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2

  # Splash
  flutter_native_splash: ^2.4.3

  # Fonts
  google_fonts: ^6.2.1
  sweph: ^3.2.1+2.10.3
  path_provider: ^2.1.5

  # App version
  package_info_plus: ^8.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Home-screen widgets (Android data bridge)
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  background_color: "#050714"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/moon_circle.png
    - assets/moon.jpg
    - assets/launch_moon.png
    - assets/ephemeris/
    - assets/cities/
    - assets/fonts/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
